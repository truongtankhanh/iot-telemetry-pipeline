packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild

# A transitive dependency held at a patched version until the package that pulls it in catches up.
overrides:
  # GHSA-q7qp-rjg7-q26m, a denial of service through a pending asynchronous fileFilter: fixed in multer 2.5.0.
  # @nestjs/platform-express (12.1.3, and 12.2.0 as well) pins multer 2.4.0 exactly, so the lockfile alone cannot move it.
  # ingest has no upload route. Remove this when platform-express pins 2.5.0 or later.
  multer: ^2.5.0
