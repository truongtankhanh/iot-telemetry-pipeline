# Mosquitto 2.x for the telemetry pipeline (development / single-site).
listener 1883
# Development only. Production: password_file or a TLS client-certificate setup, plus an ACL.
allow_anonymous true

# The default (1000) silently drops QoS 1 messages once a subscriber falls behind during a burst —
# see docs/benchmarks.md. Size the queue for the longest burst you expect to absorb.
max_queued_messages 200000
max_inflight_messages 100

persistence false
log_dest stdout
