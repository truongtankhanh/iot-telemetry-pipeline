# Deliberately lossy broker for the V1-T01 check: one message in flight and a tiny queue per
# connection, so a 50 000-message burst overflows the queue and QoS 1 messages vanish silently.
# Never use outside deploy/bench.
listener 1883
allow_anonymous true

max_queued_messages 10
max_inflight_messages 1

persistence false
log_dest stdout
