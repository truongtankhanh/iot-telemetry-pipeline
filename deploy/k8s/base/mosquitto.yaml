apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels: { app.kubernetes.io/name: mosquitto }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mosquitto }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mosquitto }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.18
          ports:
            - { name: mqtt, containerPort: 1883 }
          volumeMounts:
            - { name: config, mountPath: /mosquitto/config, readOnly: true }
          readinessProbe:
            tcpSocket: { port: mqtt }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: config
          configMap: { name: mosquitto-config }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector: { app.kubernetes.io/name: mosquitto }
  ports:
    - { name: mqtt, port: 1883, targetPort: mqtt }
