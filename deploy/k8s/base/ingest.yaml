apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingest
  labels: { app.kubernetes.io/name: telemetry-ingest }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: telemetry-ingest }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: telemetry-ingest }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3100'
        prometheus.io/path: /metrics
    spec:
      # Long enough for SIGTERM → stop consuming → drain the write buffer (ADR-0002).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ingest
          image: ghcr.io/truongtankhanh/telemetry-ingest:0.1.0
          ports:
            - { name: http, containerPort: 3100 }
          envFrom:
            - configMapRef: { name: telemetry-ingest-env }
            - secretRef: { name: telemetry-ingest-secrets }
          env:
            - { name: CONFIG_DIR, value: /app/config }
          volumeMounts:
            - { name: registry, mountPath: /app/config, readOnly: true }
          # Liveness only checks the process; readiness also needs the database and the broker.
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 250m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: registry
          configMap: { name: telemetry-registry }
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingest
  labels: { app.kubernetes.io/name: telemetry-ingest }
spec:
  selector: { app.kubernetes.io/name: telemetry-ingest }
  ports:
    - { name: http, port: 3100, targetPort: http }
---
# Replicas share one MQTT subscription group, so adding pods adds throughput (ADR-0001).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetry-ingest
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: telemetry-ingest }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: telemetry-ingest
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: telemetry-ingest }
