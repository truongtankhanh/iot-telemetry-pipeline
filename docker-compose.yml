# Prefer the pnpm scripts: `pnpm docker:up|down|restart` (PostgreSQL and Mosquitto, for development
# and the e2e suite) and `pnpm docker:demo` (the whole demo). Underneath:
# Whole pipeline:  docker compose up --build
# With demo traffic:  docker compose --profile demo up --build
# Delivering alerts to ops-command-center needs its Keycloak token: see the README.
# Host ports can be moved in the root `.env` (copy .env.example): POSTGRES_HOST_PORT (5433),
# MQTT_HOST_PORT (1883), STUDIO_HOST_PORT (3200, Simulator Studio of the demo). Start/stop only PostgreSQL and Mosquitto with `pnpm docker:up|down|restart`.
# Prometheus and Grafana on the shipped rules and dashboard (demo only): `pnpm docker:observe`, or add
# `--profile observe`; their ports are PROMETHEUS_HOST_PORT (9090) and GRAFANA_HOST_PORT (3000).
name: iot-telemetry-pipeline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d telemetry']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'

  mosquitto:
    # 2.0.22, the newest 2.0.x image (2.0.18 before 2026-10-19). The 2.0.19 to 2.0.21 releases fix shared-subscription
    # and SUBSCRIBE handling; 2.1 is not used because it changes defaults (max_packet_size, receive maximum).
    # The same tag is in deploy/bench/docker-compose.replicas.yml, deploy/k8s/base/mosquitto.yaml,
    # .github/workflows/ci.yml and scripts/ci-local.sh: change all five together.
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - '${MQTT_HOST_PORT:-1883}:1883'

  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/telemetry
      MQTT_URL: mqtt://mosquitto:1883
      API_DOCS_ENABLED: 'true' # the demo points readers at /api/docs
      OCC_API_URL: ${OCC_API_URL:-}
      OCC_TOKEN_URL: ${OCC_TOKEN_URL:-}
      OCC_CLIENT_ID: ${OCC_CLIENT_ID:-}
      OCC_CLIENT_SECRET: ${OCC_CLIENT_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - '3100:3100'
    # Matches the drain time on shutdown (ADR-0002).
    stop_grace_period: 30s

  simulator:
    profiles: [demo]
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    command: ['--broker', 'mqtt://mosquitto:1883', '--scenario', 'server-room-overheat']
    environment:
      # Simulator Studio and its control API, which has no authentication. Inside the container the server must
      # listen on every interface for the published port to reach it, so the non-loopback guard is lifted
      # here (CONTROL_ALLOW_NON_LOOPBACK); what keeps it private is the port below, published on 127.0.0.1 only.
      CONTROL_HOST: 0.0.0.0
      CONTROL_ALLOW_NON_LOOPBACK: 'true'
      INGEST_URL: http://ingest:3100
    ports:
      - '127.0.0.1:${STUDIO_HOST_PORT:-3200}:3200'
    depends_on:
      ingest:
        condition: service_healthy

  # The `observe` profile: Prometheus scrapes the ingest above and loads deploy/observability/prometheus,
  # Grafana provisions the dashboard of deploy/observability/grafana. Demo only: both are published on
  # localhost, Grafana lets anyone on this machine view the dashboards (anonymous Viewer) and Prometheus
  # has no authentication. The images are pinned by digest; Dependabot (docker-compose) moves them.
  prometheus:
    profiles: [observe]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'

  grafana:
    profiles: [observe]
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/telemetry-ingest.json:/var/lib/grafana/dashboards/telemetry-ingest.json:ro
    depends_on:
      - prometheus
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000'

volumes:
  pgdata:
