# Prefer the pnpm scripts: `pnpm docker:up|down|restart` (PostgreSQL and Mosquitto, for development
# and the e2e suite) and `pnpm docker:demo` (the whole demo). Underneath:
# Whole pipeline:  docker compose up --build
# With demo traffic:  docker compose --profile demo up --build
# Delivering alerts to ops-command-center needs its Keycloak token: see the README.
# Host ports can be moved in the root `.env` (copy .env.example): POSTGRES_HOST_PORT (5433),
# MQTT_HOST_PORT (1883). Start/stop only PostgreSQL and Mosquitto with `pnpm docker:up|down|restart`.
name: iot-telemetry-pipeline

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d telemetry']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - '${MQTT_HOST_PORT:-1883}:1883'

  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/telemetry
      MQTT_URL: mqtt://mosquitto:1883
      API_DOCS_ENABLED: 'true' # the demo points readers at /api/docs
      OCC_API_URL: ${OCC_API_URL:-}
      OCC_TOKEN_URL: ${OCC_TOKEN_URL:-}
      OCC_CLIENT_ID: ${OCC_CLIENT_ID:-}
      OCC_CLIENT_SECRET: ${OCC_CLIENT_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - '3100:3100'
    # Matches the drain time on shutdown (ADR-0002).
    stop_grace_period: 30s

  simulator:
    profiles: [demo]
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    command: ['--broker', 'mqtt://mosquitto:1883', '--scenario', 'server-room-overheat']
    depends_on:
      ingest:
        condition: service_healthy

volumes:
  pgdata:
