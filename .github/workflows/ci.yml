name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository or talks to the GitHub API: the token is read-only by declaration,
# not by the repository's default setting.
permissions:
  contents: read

# CI can be switched off for the repository with the Actions variable CI_ENABLED=false
# (`pnpm ci:off`, back with `pnpm ci:on`). Unset or any other value means it runs. A skipped job
# counts as passed for a required check; `pnpm ci:local` runs the same steps on this machine.
#
# Third-party actions are pinned to the commit of a release (the version is in the comment), so a
# moved tag cannot change what runs. Dependabot proposes newer versions.
jobs:
  verify:
    name: Lint, typecheck, unit + e2e tests, build
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemetry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/telemetry_test
      MQTT_URL: mqtt://localhost:1883
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The image Compose and Kubernetes deploy, with the repository's config mounted. A `services:`
      # container cannot do this: GitHub starts it before the checkout, so the file would not exist yet.
      - name: Start Mosquitto from the deployed image, with the repository's broker config
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.18
          for i in $(seq 1 30); do
            docker exec mosquitto mosquitto_pub -h 127.0.0.1 -t ci/ready -m 1 && exit 0
            sleep 1
          done
          echo 'Mosquitto did not become ready' >&2
          docker logs mosquitto
          exit 1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      # docs/openapi.json is generated from the built controllers; this fails when a change to a route
      # or DTO did not regenerate it (`pnpm docs:openapi`). It needs the build just above.
      - name: OpenAPI document is current
        run: pnpm --filter @itp/ingest openapi:check

  manifests:
    name: Kubernetes manifests
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned by version and by checksum (the hashes are the ones the releases publish): a download
      # that differs from the release the repository was reviewed against fails the job.
      - name: Install kustomize and kubeconform
        run: |
          curl -fsSLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8  kustomize_v5.7.1_linux_amd64.tar.gz" | sha256sum --check
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform-linux-amd64.tar.gz" | sha256sum --check
          tar xzf kustomize_v5.7.1_linux_amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
      - name: Build and validate
        run: |
          ./kustomize build --load-restrictor LoadRestrictionsNone deploy/k8s/overlays/local > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 rendered.yaml

  images:
    name: Docker images
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose --profile demo build
