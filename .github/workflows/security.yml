name: Security audit

# Audits the dependencies in pnpm-lock.yaml against the npm advisory database. Separate from CI: an
# advisory published today fails a build that did not change, so it must never be able to turn a
# pull request red for a reason that is not in the pull request.
#
# Two jobs, one policy each:
#  - production: what ships in the images. Fails on any high or critical advisory. Meant to be
#    required.
#  - all-dependencies: the same check over the development toolchain too. It fails visibly but is
#    NOT a required check, so a test-time advisory is seen without blocking merges.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - '**/package.json'

# The audit reads the lockfile and asks a public registry; it writes nothing.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pnpm audit reads pnpm-lock.yaml, so nothing is installed.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  all-dependencies:
    name: All dependencies, development tools included (not a required check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Audit all dependencies
        run: pnpm audit --audit-level=high
