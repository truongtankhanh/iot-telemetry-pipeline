name: platform-aws contract

# Runs the pipeline's parity test against platform-aws's CURRENT telemetry stack (V1-T07, ADR-0010),
# so a renamed share group, client id prefix, port or metric there is noticed here without waiting
# for a pipeline PR. Separate from the pull-request workflow: it depends on another repository.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# The job reads this repository and one public file; it writes nothing.
permissions:
  contents: read

# No concurrency group: one scheduled run a day, and a manual run is rare.

jobs:
  contract:
    name: Parity test against platform-aws main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch platform-aws's telemetry stack
        run: curl -fsSL https://raw.githubusercontent.com/truongtankhanh/platform-aws/main/lib/stacks/telemetry.ts -o "$RUNNER_TEMP/telemetry.ts"
      - name: Build what the tests import
        run: pnpm --filter @itp/telemetry-contract build
      - name: Parity test
        run: pnpm --filter @itp/ingest exec jest --runInBand src/platform-aws.contract.spec.ts
        env:
          NODE_OPTIONS: --experimental-vm-modules
          PLATFORM_AWS_TELEMETRY_PATH: ${{ runner.temp }}/telemetry.ts
