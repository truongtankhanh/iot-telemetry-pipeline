# Dependabot version updates. Monthly, one entry per ecosystem the repository uses, at most two open
# pull requests each: a one-person demo repository cannot review more, and an update that waits a few
# weeks costs nothing. Security advisories are not delayed by this schedule (see security.yml).
#
# Pins are only useful if something moves them: the action SHAs in .github/workflows, the Node image
# digest in both Dockerfiles, the Compose images and the npm lockfile all go stale otherwise. Each
# update arrives as a pull request that the ordinary CI workflow checks.
#
# Major versions are not proposed for npm packages, node or postgres: a major is adopted by hand, in
# one pull request that changes every place that names it together (for Node: .nvmrc, `engines`, both
# Dockerfiles, ci.yml and scripts/ci-local.sh; for PostgreSQL: docker-compose.yml, ci.yml,
# scripts/ci-local.sh and deploy/k8s; for a package: the lockfile and whatever the release notes ask).
# Minor, patch and digest updates still arrive. Majors of GitHub Actions are still proposed.
#
# Not covered: the image in deploy/k8s (Dependabot does not read kustomize manifests). The broker tag
# eclipse-mosquitto has five copies (docker-compose.yml, deploy/bench/docker-compose.replicas.yml,
# deploy/k8s/base/mosquitto.yaml, ci.yml, scripts/ci-local.sh): a Dependabot pull request changes only
# the first, so change the other four in the same pull request.
version: 2

updates:
  # The SHA pins of the workflows. Dependabot keeps the SHA and rewrites the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci

  # pnpm workspaces (apps/* and packages/*) with one lockfile at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The node:24-alpine base of both Dockerfiles, which is pinned by digest.
  - package-ecosystem: docker
    directories:
      - /apps/ingest
      - /apps/simulator
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(docker)
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # postgres and eclipse-mosquitto in docker-compose.yml, and prom/prometheus and grafana/grafana of
  # its `observe` profile, which are pinned by digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(docker)
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
